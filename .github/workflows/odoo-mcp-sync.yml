# CI: Verifica que la copia embebida de odoo-mcp no diverge del repo canónico.
# FALLE si hay diferencias entre los archivos de código fuente.

name: "odoo-mcp sync check"

on:
  push:
    paths:
      - "odooclaw/workspace/skills/odoo-mcp/**"
      - ".github/workflows/odoo-mcp-sync.yml"
  pull_request:
    paths:
      - "odooclaw/workspace/skills/odoo-mcp/**"
      - ".github/workflows/odoo-mcp-sync.yml"
  # Run daily to catch drift
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-sync:
    name: "Verify odoo-mcp embedded copy matches canonical"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout odooclaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical odoo-mcp repo
        uses: actions/checkout@v4
        with:
          repository: nicolasramos/odooclaw-mcp
          path: .canonical-odoo-mcp
          fetch-depth: 1

      - name: Compare embedded vs canonical source files
        run: |
          EMBEDDED="odooclaw/workspace/skills/odoo-mcp"
          CANONICAL=".canonical-odoo-mcp"
          FAIL=0

          # Files that exist in both repos — compare them (exclude README.md, docs)
          comm -12 \
            <(find "$EMBEDDED" src tests requirements.txt -type f 2>/dev/null | sed "s|^$EMBEDDED/||" | sort) \
            <(cd "$CANONICAL" && find src tests requirements.txt -type f 2>/dev/null | sed 's|^\./||' | sort) \
          | while read -r relpath; do
              # Skip README — documentation differs by context
              case "$relpath" in
                README.md) continue ;;
              esac

              if [ -f "$EMBEDDED/$relpath" ] && [ -f "$CANONICAL/$relpath" ]; then
                if ! diff -q "$EMBEDDED/$relpath" "$CANONICAL/$relpath" > /dev/null 2>&1; then
                  echo "DIFFER: $relpath" >&2
                  FAIL=1
                fi
              fi
            done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::La copia embebida diverge del repo canónico nicolasramos/odooclaw-mcp." >&2
            echo "Ejecuta scripts/sync-odoo-mcp.sh para regenerar la copia embebida." >&2
            exit 1
          fi

          echo "OK: La copia embebida está sincronizada con el repo canónico."
